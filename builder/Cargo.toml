[package]
name = "builder"
version.workspace = true
edition.workspace = true

[features]
default = ["wfs"]
wfs = ["dep:wfs", "dep:host-wfs", "dep:host-shared" ]

[dependencies]
shared.workspace = true
gpt.workspace = true

host-shared = { workspace = true, optional = true }
host-wfs = { workspace = true, optional = true }
wfs = { workspace = true, optional = true }

anyhow.workspace = true
cargo_toml = "0.22"
clap = { version = "4.5", features = ["derive"] }
congen.workspace = true
fatfs = "0.3.6"
gpt_builder = { version = "4.1.0", package = "gpt" }
log.workspace = true
nix = { version = "0.31", features = [ "term" ] }
reqwest = { version = "0.13.4" }
ron = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "rc" ] }
sha2 = "0.10.8"
simple_logger.workspace = true 
thiserror.workspace = true
tokio = { version = "1.32.0", features = ["full"] }
uuid.workspace = true
parse-size = "1.1.0"

[dev-dependencies]
# included here so cargo does not warn about an unused dependency. 
# The builder will manually build this crate and pull the version from Cargo.toml
bootloader-x86_64-uefi.workspace = true

[lints]
workspace = true
